<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page Not Found | PixelQuest</title>

    <meta
        name="description"
        content="The requested PixelQuest page could not be found. Return to the homepage and browse free gaming wallpapers."
    >

    <meta
        name="robots"
        content="noindex, follow"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/favicon.png"
    >

    <link
        rel="stylesheet"
        href="/style.css?v=12"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        .error-page {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 16px;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(124, 92, 255, 0.2),
                    transparent 38%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(0, 212, 255, 0.12),
                    transparent 35%
                ),
                var(--bg);
        }

        .error-card {
            width: min(100%, 720px);
            padding: 56px 30px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(21, 30, 46, 0.95);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .error-code {
            display: block;
            margin-bottom: 10px;
            color: var(--purple);
            font-family: var(--heading-font);
            font-size: clamp(80px, 18vw, 150px);
            font-weight: 800;
            line-height: 1;
        }

        .error-card h1 {
            margin-bottom: 16px;
            font-family: var(--heading-font);
            font-size: clamp(30px, 6vw, 48px);
        }

        .error-card p {
            max-width: 560px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .error-home-button,
        .error-wallpapers-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 12px 20px;
            border-radius: 11px;
            font-weight: 700;
        }

        .error-home-button {
            background: linear-gradient(
                135deg,
                var(--purple),
                var(--purple2)
            );
            color: #ffffff;
        }

        .error-wallpapers-button {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #1c2638;
            color: #ffffff;
        }

        @media (max-width: 600px) {

            .error-card {
                padding: 42px 20px;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-home-button,
            .error-wallpapers-button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <header class="site-header">

        <div class="container header-container">

            <a
                href="/"
                class="logo"
            >
                🎮 PixelQuest
            </a>

            <nav class="desktop-nav">

                <a href="/">Home</a>
                <a href="/#latest">Wallpapers</a>
                <a href="/#games">Games</a>
                <a href="/pages/category.html">Categories</a>
                <a href="/pages/about.html">About</a>

            </nav>

        </div>

    </header>

    <main class="error-page">

        <section class="error-card">

            <span class="error-code">
                404
            </span>

            <h1>
                This Quest Could Not Be Found
            </h1>

            <p>
                The page may have been moved, deleted or the address may be
                incorrect. Return to PixelQuest and continue exploring free
                gaming wallpapers.
            </p>

            <div class="error-actions">

                <a
                    href="/"
                    class="error-home-button"
                >
                    Return Home
                </a>

                <a
                    href="/#latest"
                    class="error-wallpapers-button"
                >
                    Browse Wallpapers
                </a>

            </div>

        </section>

    </main>

</body>

</html>
